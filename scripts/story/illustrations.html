<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Story Illustrations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=block">
<style>
  html, body { margin: 0; background: #594d69; }
  svg { display: block; font-family: Kanit, "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
// The home page's story illustrations (components/Home/storyPosts.tsx): one
// six-second loop per chapter, drawn here frame by frame and recorded by
// render.mjs into public/story/<name>.mp4 and .jpg. ?scene=<name>&t=<s>
// shows one frame. Colours are the head's theme (theme/head.json).
const P = { light: '#ede4e3', peach: '#d3aba0', rose: '#a57374', purple: '#594d69', blue: '#1c265b',
  indigo: '#0b1953', navy: '#040227', dark: '#010018', pass: '#8fd6a0', fail: '#e0604f' };
const LOOP = 6;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const T = (x, y, s, size = 40, w = 500, fill = P.light, anchor = 'start') =>
  `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}">${esc(s)}</text>`;
const bg = (a, b) => `<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1280" height="720" fill="url(#bg)"/>`;
function browser(x, y, w, h, url, inner) {
  return `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" rx="26" fill="${P.light}"/>
    <path d="M0 26 a26 26 0 0 1 26 -26 h${w - 52} a26 26 0 0 1 26 26 v34 h-${w} z" fill="${P.purple}"/>
    <circle cx="34" cy="30" r="9" fill="${P.rose}"/><circle cx="62" cy="30" r="9" fill="${P.peach}"/><circle cx="90" cy="30" r="9" fill="${P.light}"/>
    <rect x="130" y="16" width="${w - 170}" height="28" rx="14" fill="rgba(237,228,227,0.25)"/>${T(150, 38, url, 20, 400)}
    <g transform="translate(0 60)">${inner}</g></g>`;
}
const head = (x, y, s, eyes = P.light) => `<g transform="translate(${x} ${y}) scale(${s})">
  <ellipse rx="40" ry="48" fill="${P.navy}" stroke="${P.peach}" stroke-width="3"/>
  <ellipse cx="-14" cy="-6" rx="7" ry="4.5" fill="${eyes}"/><ellipse cx="14" cy="-6" rx="7" ry="4.5" fill="${eyes}"/>
  <path d="M-12 18 Q0 25 12 18" stroke="${P.rose}" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;
const bug = (x, y, t) => {
  const w = Math.sin(t * 24) * 4;
  return `<g transform="translate(${x} ${y})"><path d="M-12 -9 L-20 ${-15 + w} M0 -10 L0 ${-19 - w} M12 -9 L20 ${-15 - w} M-12 9 L-20 ${15 - w} M0 10 L0 ${19 + w} M12 9 L20 ${15 + w}" stroke="${P.dark}" stroke-width="3"/>
    <ellipse rx="17" ry="11" fill="${P.dark}"/><circle cx="17" r="6" fill="${P.dark}"/></g>`;
};

const SCENES = {
  'texas-tech': (t) => {
    const pulse = 0.5 + 0.5 * Math.sin(t * 30);
    const bang = t > 3.4 && t < 4.4 ? 1 - (t - 3.4) : 0;
    const bob = Math.sin((t / LOOP) * Math.PI * 2) * 10;
    let s = bg(P.blue, P.purple);
    s += `<g transform="translate(0 ${bob})">
      <ellipse cx="720" cy="380" rx="320" ry="40" fill="${P.light}"/>
      <path d="M660 380 L580 200 L700 200 L800 380 Z M660 380 L580 560 L700 560 L800 380 Z" fill="${P.peach}"/>
      <path d="M430 380 L370 280 L440 280 L490 372 Z" fill="${P.peach}"/>
      <rect x="490" y="296" width="380" height="32" rx="16" fill="${P.rose}"/>
      <ellipse cx="${450 - pulse * 30}" cy="312" rx="${34 + pulse * 46}" ry="${12 + pulse * 6}" fill="#ffb36b" opacity="0.9"/></g>`;
    if (bang > 0) s += `<g transform="translate(420 ${312 + bob}) scale(${0.8 + (1 - bang) * 1.4})" opacity="${bang}">
      <path d="M0 -120 L28 -38 L112 -62 L48 0 L112 62 L28 38 L0 120 L-28 38 L-112 62 L-48 0 L-112 -62 L-28 -38 Z" fill="#ffd27a"/></g>
      ${T(640, 660, 'BANG!', 110, 700, '#ffd27a', 'middle')}<rect width="1280" height="720" fill="#fff4dc" opacity="${bang * 0.35}"/>`;
    return s;
  },
  'pipe-engineer': (t) => {
    const stress = 0.5 + 0.5 * Math.sin(t * 2);
    const col = `rgb(${Math.round(lerp(211, 224, stress))},${Math.round(lerp(171, 96, stress))},${Math.round(lerp(160, 79, stress))})`;
    const needle = -2.2 + stress * 1.4;
    let bugs = '';
    for (let i = 0; i < 6; i++) bugs += bug(40 + ((t / LOOP) * 560 + i * 94) % 560, 140 + i * 56 + Math.sin(t * 5 + i) * 8, t + i);
    return bg(P.purple, P.rose) + `
      <path d="M60 560 L260 560 Q340 560 340 480 L340 260 L520 260" stroke="${col}" stroke-width="54" fill="none"/>
      <circle cx="200" cy="300" r="74" fill="none" stroke="${P.light}" stroke-width="7"/>
      <line x1="200" y1="300" x2="${200 + 58 * Math.cos(needle)}" y2="${300 + 58 * Math.sin(needle)}" stroke="${P.light}" stroke-width="7" stroke-linecap="round"/>
      ${browser(580, 90, 640, 540, 'stress analysis software', `
        ${[0, 1, 2, 3, 4, 5, 6].map((i) => `<rect x="40" y="${50 + i * 56}" width="${260 + (i * 97) % 280}" height="16" rx="8" fill="rgba(89,77,105,0.3)"/>`).join('')}
        ${bugs}`)}`;
  },
  freelance: (t) => {
    const k = ease(t / 4);
    const bump = Math.max(0, Math.sin(((t * 3) % 1) * Math.PI)) * 8;
    return bg(P.blue, P.rose) + browser(140, 70, 1000, 580, 'your-shop.com', `
      ${[0, 1, 2].map((i) => `<rect x="${60 + i * 300}" y="50" width="260" height="230" rx="20" fill="${[P.peach, P.rose, P.purple][i]}"/>
        <rect x="${90 + i * 300}" y="300" width="200" height="50" rx="25" fill="${P.navy}"/>${T(190 + i * 300, 334, 'Add to cart', 24, 500, P.light, 'middle')}`).join('')}
      <g transform="translate(880 ${-38 - bump})"><path d="M0 0 h18 l14 50 h48 l12 -36 h-66" stroke="${P.light}" stroke-width="5" fill="none"/>
        <circle cx="38" cy="64" r="6" fill="${P.light}"/><circle cx="74" cy="64" r="6" fill="${P.light}"/></g>
      ${T(500, 460, '$' + Math.round(250 * k) + 'K+ a year', 76, 700, P.navy, 'middle')}`);
  },
  usaa: (t) => {
    const stages = ['Build', 'Test', 'Release'];
    let s = bg(P.indigo, P.purple);
    s += stages.map((n, i) => `<rect x="${150 + i * 360}" y="150" width="260" height="130" rx="26" fill="rgba(237,228,227,0.16)" stroke="${P.light}" stroke-width="4"/>
      ${T(280 + i * 360, 232, n, 46, 500, P.light, 'middle')}`).join('');
    s += `<line x1="110" y1="340" x2="1170" y2="340" stroke="rgba(237,228,227,0.4)" stroke-width="4"/>`;
    for (let j = 0; j < 5; j++) { const x = 110 + (((t / LOOP) * 1060 * 2 + j * 212) % 1060); s += `<circle cx="${x}" cy="340" r="16" fill="${P.peach}"/>`; }
    for (let i = 0; i < 3; i++) if (((t + i * 0.6) % 2) > 1) s += T(390 + i * 360, 200, '✓', 44, 700, P.pass, 'middle');
    s += T(640, 450, 'Thousands of hours saved', 54, 700, P.peach, 'middle');
    for (let i = 0; i < 5; i++) s += head(400 + i * 120, 590 + Math.sin(t * 2 + i) * 6, 0.9);
    return s;
  },
  gulp: (t) => {
    const n = Math.round(2000 * ease((t - 0.3) / 4));
    let pills = '';
    for (let i = 0; i < 9; i++) {
      const drop = ((t * 0.8 + i / 9) % 1);
      const y = lerp(120, 520 - Math.floor(i / 3) * 34, ease(drop * 1.4));
      pills += `<ellipse cx="${300 + (i % 3) * 56}" cy="${y}" rx="22" ry="13" fill="${[P.peach, P.rose, P.light][i % 3]}"/>`;
    }
    return bg(P.purple, P.peach) + `
      <rect x="200" y="200" width="320" height="400" rx="50" fill="rgba(237,228,227,0.28)" stroke="${P.light}" stroke-width="6"/>
      <rect x="250" y="150" width="220" height="70" rx="16" fill="${P.rose}"/>${pills}
      ${T(900, 360, n.toLocaleString('en-US') + '+', 130, 700, P.light, 'middle')}
      ${T(900, 430, 'signups in three months', 44, 400, P.light, 'middle')}`;
  },
  today: (t) => {
    let s = bg(P.indigo, P.blue);
    for (let i = 0; i < 4; i++) {
      const y = 130 + i * 140;
      s += head(200, y, 1.1);
      for (let j = 0; j < 3; j++) {
        const w = clamp(((t * 220 + i * 90 + j * 140) % 760), 60, 760 - j * 140);
        s += `<rect x="300" y="${y - 40 + j * 30}" width="${w}" height="18" rx="9" fill="${[P.peach, P.light, P.rose][j]}" opacity="0.85"/>`;
      }
      if ((t * 2 + i) % 2 < 1) s += `<rect x="${300 + clamp(((t * 220 + i * 90) % 760), 60, 760) + 8}" y="${y - 44}" width="6" height="26" fill="${P.light}"/>`;
    }
    return s;
  },
  'vibe-verifier': (t) => {
    let s = bg(P.navy, P.purple);
    const shift = ((t / LOOP) * 6) % 1;
    for (let i = 0; i < 7; i++) {
      const row = i - shift;
      const y = 90 + row * 92;
      const pr = 1300 + Math.floor((t / LOOP) * 6) + i;
      const ok = pr % 4 !== 2;
      const checked = row < 4.5;
      const op = clamp(1 - Math.abs(row - 3) / 4, 0, 1);
      s += `<g opacity="${op}"><rect x="160" y="${y}" width="960" height="70" rx="18" fill="rgba(237,228,227,0.14)"/>
        ${T(200, y + 46, 'Pull request #' + pr, 32, 500)}
        <rect x="560" y="${y + 28}" width="${220 + (pr * 53) % 220}" height="14" rx="7" fill="rgba(237,228,227,0.3)"/>
        ${checked ? T(1070, y + 50, ok ? '✓' : '✗', 46, 700, ok ? P.pass : P.fail, 'middle') : ''}</g>`;
    }
    return s;
  },
  improv: (t) => {
    const sweep = Math.sin((t / LOOP) * Math.PI * 2) * 120;
    return bg(P.dark, P.purple) + `
      <path d="M640 40 L${400 + sweep} 640 L${880 + sweep} 640 Z" fill="rgba(255,240,200,0.22)"/>
      <ellipse cx="${640 + sweep}" cy="640" rx="260" ry="34" fill="rgba(255,240,200,0.3)"/>
      <path d="M0 0 Q90 360 0 720 L230 720 Q150 360 260 0 Z" fill="${P.rose}"/>
      <path d="M1280 0 Q1190 360 1280 720 L1050 720 Q1130 360 1020 0 Z" fill="${P.rose}"/>
      <rect width="1280" height="60" fill="${P.rose}"/>
      ${T(640 + sweep * 0.3, 470, 'Yes, and…', 120, 700, P.light, 'middle')}`;
  },
  'whats-next': (t) => {
    const p = (t % 3) / 3;
    const cardX = lerp(330, 640, ease(p / 0.5));
    const merged = p > 0.62;
    let s = bg(P.purple, P.peach);
    s += head(200, 360, 1.6);
    s += `<g transform="translate(${cardX - 160} 270)"><rect width="320" height="180" rx="24" fill="${P.light}"/>
      ${T(30, 60, 'Pull request', 34, 700, P.navy)}
      <rect x="30" y="90" width="220" height="14" rx="7" fill="rgba(89,77,105,0.35)"/>
      <rect x="30" y="122" width="160" height="14" rx="7" fill="rgba(89,77,105,0.35)"/></g>`;
    ['Tests', 'Review', 'Checks'].forEach((n, i) => {
      const on = p > 0.35 + i * 0.08;
      s += `${T(900, 270 + i * 70, (on ? '✓ ' : '· ') + n, 42, 500, on ? P.pass : P.light)}`;
    });
    if (merged) s += `<rect x="860" y="470" width="260" height="80" rx="40" fill="${P.navy}"/>${T(990, 525, 'Merged', 42, 700, P.peach, 'middle')}`;
    return s;
  },
};

function render(t) {
  const scene = new URLSearchParams(location.search).get('scene');
  document.getElementById('s').innerHTML = SCENES[scene](t % LOOP);
}
window.render = render;
window.LOOP = LOOP;
window.SCENES = Object.keys(SCENES);
const fixed = new URLSearchParams(location.search).get('t');
if (fixed !== null) render(+fixed);
</script>
</body>
</html>
