<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Story Scenes</title>
<style>html, body { margin: 0; background: #594d69; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// The home page's simpler story illustrations (components/Home/storyPosts.tsx;
// studio.html has the rest): a six-second 3D loop each, in the site's own look (the dawn sky the
// head reflects, its glossy black skin, the theme's colours), drawn frame by
// frame here and recorded by render.mjs into public/story/<scene>.mp4 and
// its first frame, <scene>.jpg. Open ?scene=<name>&t=<seconds> for one frame.
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const LOOP = 6;
const TAU = Math.PI * 2;
const C = { light: '#ede4e3', peach: '#d3aba0', purple: '#594d69', blue: '#1c265b', navy: '#040227', pass: '#8fd6a0', fail: '#e0604f' };
const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const loopT = (t) => ((t % LOOP) + LOOP) % LOOP;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1280, 720);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1280 / 720, 0.1, 500);
const sky = await new RGBELoader().loadAsync('/scripts/environment/kiara_1_dawn_1k.hdr');
sky.mapping = THREE.EquirectangularReflectionMapping;
scene.environment = sky;
scene.background = sky;
scene.backgroundBlurriness = 0.45;
scene.backgroundIntensity = 0.85;
scene.environmentIntensity = 1;

// The head's skin: glossy black that shows the sky (components/Background/headSkin.ts).
const GLOSS = { clearcoat: 0.6, clearcoatRoughness: 0.1, roughness: 0.22, metalness: 0.25 };
const gloss = (color, extra = {}) => new THREE.MeshPhysicalMaterial({ color, ...GLOSS, ...extra });
const box = (w, h, d, r = 0.1) => new RoundedBoxGeometry(w, h, d, 4, r);
const mesh = (g, m, parent = scene) => { const o = new THREE.Mesh(g, m); parent.add(o); return o; };
const group = (parent = scene) => { const g = new THREE.Group(); parent.add(g); return g; };
const orbit = (t, radius, height, target, from = 0.35, sweep = 0.35) => {
  const a = from + Math.sin((loopT(t) / LOOP) * TAU) * sweep * 0.5;
  camera.position.set(target.x + Math.sin(a) * radius, target.y + height, target.z + Math.cos(a) * radius);
  camera.lookAt(target);
};
// A small glossy head, the site's head in miniature: an egg with two eyes.
function littleHead(parent, scale = 1) {
  const g = group(parent);
  const skull = mesh(new THREE.SphereGeometry(1, 40, 30), gloss(C.navy), g);
  skull.scale.set(0.82, 1, 0.9);
  for (const x of [-0.32, 0.32]) {
    const eye = mesh(new THREE.SphereGeometry(0.16, 16, 12), gloss(C.light), g);
    eye.position.set(x, 0.12, 0.86);
    eye.scale.set(1.3, 0.75, 0.6);
  }
  g.scale.setScalar(scale);
  return g;
}

const SCENES = {
  'whats-next'() {
    const main = mesh(new THREE.CylinderGeometry(0.16, 0.16, 18, 16), gloss(C.light));
    main.rotation.z = Math.PI / 2;
    const branchCurve = new THREE.CubicBezierCurve3(new THREE.Vector3(-4, 0, 0), new THREE.Vector3(-2.5, 2.8, 0), new THREE.Vector3(2.5, 2.8, 0), new THREE.Vector3(4, 0, 0));
    mesh(new THREE.TubeGeometry(branchCurve, 120, 0.14, 12), gloss(C.peach));
    for (const x of [-7, -4, 4, 7]) mesh(new THREE.SphereGeometry(0.36, 24, 18), gloss(C.navy), scene).position.x = x;
    const merge = mesh(new THREE.SphereGeometry(0.42, 24, 18), gloss(C.light, { emissive: C.pass, emissiveIntensity: 0 }));
    merge.position.x = 4;
    const agent = littleHead(scene, 0.7);
    agent.position.set(-4.6, 1.6, 0.6);
    const card = group();
    mesh(box(1.4, 0.9, 0.12, 0.06), gloss(C.light), card);
    for (const [w, y] of [[0.9, 0.2], [0.6, -0.05], [0.8, -0.28]]) mesh(box(w, 0.08, 0.04, 0.02), gloss(C.purple), card).position.set(-0.1, y, 0.08);
    const checks = [0, 1, 2].map((k) => {
      const c = mesh(new THREE.SphereGeometry(0.16, 16, 12), gloss(C.pass, { emissive: C.pass, emissiveIntensity: 0.4 }));
      c.position.set(-0.8 + k * 0.8, 3.8, 0);
      return c;
    });
    return (t) => {
      const u = loopT(t);
      const p = ease((u - 0.3) / 3.8);
      card.position.copy(branchCurve.getPointAt(p)).add(new THREE.Vector3(0, 0.75, 0));
      card.rotation.y = Math.sin(u * 2) * 0.3;
      checks.forEach((c, k) => (c.scale.setScalar(ease((p - 0.35 - k * 0.12) * 6))));
      merge.material.emissiveIntensity = ease((u - 4.1) / 0.4) * (1 - ease((u - 5.4) / 0.5)) * 1.2;
      merge.scale.setScalar(1 + merge.material.emissiveIntensity * 0.3);
      agent.rotation.y = 0.4 + Math.sin(u * 2) * 0.2;
      orbit(t, 15, 3, new THREE.Vector3(0, 1, 0), -0.2, 0.4);
    };
  },
};

const params = new URLSearchParams(location.search);
// With no scene named, only the list of scenes (for render.mjs).
const update = SCENES[params.get('scene')]?.();
window.LOOP = LOOP;
window.SCENES = Object.keys(SCENES);
window.render = (t) => { update?.(t); renderer.render(scene, camera); };
window.ready = true;
if (params.get('t') !== null) window.render(+params.get('t'));
</script>
</body>
</html>
