# Security updates only, grouped into one pull request. Each Dependabot pull request gets a full QA
# walk (.github/workflows/qae-explore.yml), so four advisories are one walk, not four. The limit of
# 0 keeps version updates off; security updates are not subject to it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # TEMPORARY, for one live proof that a Dependabot pull request goes green: one version update,
    # of one package. The next change puts the limit back to 0 and drops `allow`.
    open-pull-requests-limit: 1
    allow:
      - dependency-name: react-hook-form
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
