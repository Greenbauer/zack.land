name: Code

# Runs the unit tests (npm test: Vitest over every *.test.ts file) on every pull request and on every
# push to master, and against the built site the phone More/Less spec (cypress/e2e/more-less.cy.ts)
# and the Playwright specs (e2e/*.e2e.ts: the moving views, the phone menu, a card's content).
# Target: GitHub's ubuntu-latest, with the Node version .nvmrc names, its installed Chrome for
# Cypress, and Playwright's own Chromium and WebKit for the moving views.
#
# The other Cypress specs in cypress/e2e are not run here.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this workflow free of `paths:` filters and this job free of `if:` conditions. GitHub reports
  # a job that did not run as skipped, and counts a skipped required check as satisfied.
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
        env:
          # The unit tests never open a browser, so the Cypress download is skipped.
          CYPRESS_INSTALL_BINARY: '0'
      - name: Unit tests
        run: npm test

  # More then Less on a phone puts each post back as it was: measured only in a real browser (the
  # card's height, its images' layout), so it is a Cypress spec, run on the production build. The
  # runner has no GPU: Chrome draws the 3D scene in software (cypress.config.ts).
  more-less:
    name: Phone More/Less
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: More then Less on a phone
        run: |
          npm start -- --port 3000 > server.log 2>&1 &
          for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          npx cypress run --browser chrome --spec cypress/e2e/more-less.cy.ts --config baseUrl=http://localhost:3000

  # Every way a post moves and comes back (e2e/moving-views.e2e.ts): each kind of post, left open or
  # closed, down or up and back, upright and sideways phones and two desktop sizes, and the window resized
  # while a post is open, the phone menu's hand-over to the next page (e2e/mobile-menu.e2e.ts) and what
  # fades on a card as it slides (e2e/card-content.e2e.ts), in Chromium and WebKit
  # (playwright.config.ts). Playwright's browsers are downloaded here only; installing the site (Vercel's build too) never fetches them. Split by test across two runners (about 70 minutes
  # of tests in all, past one job's 40-minute limit), as the checks `Moving views (1/2)` and `(2/2)`.
  moving-views:
    name: Moving views (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
        env:
          # This job runs Playwright, not Cypress.
          CYPRESS_INSTALL_BINARY: '0'
      - name: Chromium and WebKit for Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Build
        run: npm run build
      - name: Every moving view, in Chromium and WebKit
        run: |
          npm start -- --port 3000 > server.log 2>&1 &
          for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          npx playwright test --shard="$SHARD/2"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Traces and videos of failing moving views
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moving-views-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
