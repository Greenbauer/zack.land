name: Code

# Runs the unit tests (npm test: Vitest over every *.test.ts file) and the type check on every pull
# request and on every push to master, and against the built site the Playwright specs (e2e/*.e2e.ts:
# the moving views, More then Less on a phone, the phone menu, a card's content, the media grid, the
# 404 video, a YouTube video, the contact form).
# Target: GitHub's ubuntu-latest, with the Node version .nvmrc names; the Playwright specs run in
# Playwright's own image of the version package-lock.json pins, which carries its Chromium and WebKit
# and their system libraries.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this workflow free of `paths:` filters and this job free of `if:` conditions. GitHub reports
  # a job that did not run as skipped, and counts a skipped required check as satisfied.
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      # The type check half of `npm run lint`. Its ESLint half is the eslint gate in the Gates check
      # (.vibe-verifier). Types are not a gate: tsc judges the whole project, not the changed files.
      - name: Types
        run: npx tsc

  # Every Playwright spec (e2e/*.e2e.ts): the media grid and melt (media-grid.e2e.ts), the 404 video's
  # melt (not-found.e2e.ts), More then Less on a phone putting each post back as it was
  # (more-less.e2e.ts), the contact form's Submit button and field errors (contact-form.e2e.ts), a
  # post's YouTube video played, stopped and paused against a stand-in player (youtube.e2e.ts), and
  # every way a
  # post moves and comes back (moving-views.e2e.ts): each kind of post, left open or
  # closed, down or up and back, upright and sideways phones and two desktop sizes, and the window resized
  # while a post is open, the phone menu's hand-over to the next page (e2e/mobile-menu.e2e.ts) and what
  # fades on a card as it slides (e2e/card-content.e2e.ts), in Chromium and WebKit
  # (playwright.config.ts). The browsers come with Playwright's image (mcr.microsoft.com/playwright),
  # the one tagged with the Playwright version in package-lock.json, so the job installs nothing
  # from Ubuntu's mirrors: `playwright install --with-deps` once spent 44 of a shard's 60 minutes
  # fetching its system packages at 38 kB/s. Installing the site (Vercel's build too) never fetches
  # the browsers. Split by test across four runners (about 70 minutes of tests in all: on two, the
  # Chromium half took 40 to 55 of its 60 minutes), as the checks `Moving views (1/4)` to `(4/4)`.
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - name: The version package-lock.json pins
        id: version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  moving-views:
    name: Moving views (${{ matrix.shard }}/4)
    needs: playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Playwright's Docker guide: the host's shared memory for Chromium, which can otherwise run out
      # of memory and crash, and an init process so none is left a zombie under PID 1.
      options: --ipc=host --init
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Every moving view, in Chromium and WebKit
        run: |
          npm start -- --port 3000 > server.log 2>&1 &
          for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          npx playwright test --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Traces and videos of failing moving views
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moving-views-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
