name: QA

# Vibe Verifier QAE harness: copy to .github/workflows/qae-explore.yml, with harnesses/qae/manifest
# copied to .vibe-verifier-qae. Consumer-owned parts, marked CONSUMER below: runs-on, how the site is
# built and started (or a reachable preview URL passed in instead), the action pins. Three jobs:
#   criteria: on any runner, reads the PR body and changed paths and decides whether there is a
#            criterion to walk. Nothing else starts without one. It also decides how many explorers
#            walk them: one, unless the consumer lets a large pull request be split across more.
#   explore:  builds and starts this PR's site in a container on the runner, then an LLM
#            with a real browser (playwright-mcp) walks the PR's acceptance criteria, writes one step
#            log per criterion plus screenshots into qae-artifacts/, and a verdict in the
#            acceptance-check grammar, which it also posts as a comment for people to read.
#   verify:  deterministic. Feeds the PR body, the verdict file from the run's own evidence and the
#            artifacts to the acceptance-verdict gate, which refuses any PASS not anchored to a step
#            line that exists.
# The LLM explores and produces artifacts; the gate decides. Its prose is never the verdict.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: qae-explore-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  criteria:
    name: "Acceptance criteria: read"
    runs-on: ubuntu-latest   # CONSUMER: any runner. It holds no model login and builds nothing.
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read   # the runs and artifacts of the last walk, to carry its verdict (actions/criteria)
    outputs:
      count: ${{ steps.criteria.outputs.count }}
      ticket: ${{ steps.criteria.outputs.ticket }}
      shards: ${{ steps.criteria.outputs.shards }}
      carry: ${{ steps.criteria.outputs.carry }}
    steps:
      - name: Write the criteria inputs
        # The PR body and its changed paths. A rename lists both names: moving a page into docs/ still
        # takes it off the site. And the QAE manifest as the base has it, or as this pull request has it
        # where the base has none (a first subscription): the widths on its qae-artifacts line count
        # toward the walks the explorers are sized to.
        # A qae-inputs/ the checkout already has came from the pull request (Git makes no empty directory),
        # so the step stops before it puts anything there: a link could send these files anywhere on the runner.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -e qae-inputs ] || [ -L qae-inputs ]; then echo "::error::the pull request commits qae-inputs/, where this job puts its inputs: remove it from the branch"; exit 1; fi
          mkdir -p qae-inputs
          gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body > qae-inputs/pr-body.md
          gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > qae-inputs/changed-files
          gh api "repos/$REPO/contents/.vibe-verifier-qae?ref=$BASE_SHA" -H 'Accept: application/vnd.github.raw' > qae-inputs/manifest \
            || gh api "repos/$REPO/contents/.vibe-verifier-qae?ref=$HEAD_SHA" -H 'Accept: application/vnd.github.raw' > qae-inputs/manifest
      - name: Write the ticket's criteria   # CONSUMER: the criteria every dependency update is held to
        # A pull request that changes only package.json and package-lock.json (a Dependabot update, or
        # the same change made by hand) says nothing a browser can check, so it is held to
        # .github/qae-dependency-criteria.md, read from the base branch so that it cannot rewrite what
        # it is judged against. The explorer walks them and the gates require them (as TC1, TC2, ...) in
        # addition to any the pull request lists. Any other pull request links no ticket: an empty file.
        # A lookup that fails, or finds an empty file, fails the step, so it never reads as "no ticket".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : > qae-inputs/ticket.md
          other=$(grep -cvxE 'package(-lock)?\.json' qae-inputs/changed-files || true)
          if [ -s qae-inputs/changed-files ] && [ "$other" = 0 ]; then
            gh api "repos/$REPO/contents/.github/qae-dependency-criteria.md?ref=$BASE_SHA" \
              -H 'Accept: application/vnd.github.raw' > qae-inputs/ticket.md
            if [ ! -s qae-inputs/ticket.md ]; then echo "::error::.github/qae-dependency-criteria.md is empty at $BASE_SHA"; exit 1; fi
            echo "dependency-only pull request: held to .github/qae-dependency-criteria.md"
          fi
      - name: Read the criteria
        # A PR that declares `- None: <why>`, or lists no criteria and changes only CI configuration or
        # documentation no site renders, needs no browser check; one that lists no criteria and changes
        # the site fails the verdict gate whatever the explorer does. None of them starts the explore
        # job: it runs only when there is a criterion to walk. Decided by the same code the verify job
        # runs. Before this, three pin bumps and a CI-only PR each paid for a full explore of nothing,
        # and on 2026-09-21 one of them turned the job red on the account's usage cap for it. Decided
        # in its own job, on any runner, since 2026-10-05: on the Codex lane the explore runner holds
        # the one login, and a 6-second skip queued up to 15 minutes behind real explorations for it.
        # Its `shards` output is the explore job's matrix: one explorer, unless max-shards allows more
        # and the criteria are more walks than one is sized for (harnesses/qae/README.md).
        id: criteria
        uses: Greenbauer/vibe-verifier/actions/criteria@a996377d26f76ed69bcce23701038a62373b0661 # main 2026-10-29
        with:
          path: qae-inputs/pr-body.md
          changed-files: qae-inputs/changed-files
          ticket: qae-inputs/ticket.md
          manifest: qae-inputs/manifest
          # Twelve: the 3D pages render in software on a runner with no GPU, a few frames a second, so
          # a walk here is slow; four criteria at two widths (8 walks) left one explorer at its 30
          # minutes with no verdict (PR 113, 2026-10-27), about ten criteria each ran one out of its
          # 240 turns (8186fd7), and five each still ran one out of turns and two past 30 minutes
          # (92d6659), so PR 113's 38 get twelve, about three each. GitHub-hosted runners run them at
          # once.
          max-shards: 12   # CONSUMER: the most explorers one pull request's criteria are split across
          token: ${{ secrets.GITHUB_TOKEN }}   # carries a passing walk's verdict across an update no browser can see

  explore:
    name: "Acceptance criteria: walk"
    needs: criteria
    if: needs.criteria.outputs.count != '0'
    # One job per explorer. A pull request whose criteria are more walks than one explorer is sized
    # for is split across several, when the criteria job's max-shards allows it: each walks its own
    # share in parallel, on a runner of its own, and with fewer runners free they queue. The matrix's
    # first value is blank and stands for 1, so that job keeps the plain name (GitHub leaves a blank
    # value out of a job's name; measured 2026-10-08) and the others add (2), (3), ... to it. A step
    # reads its explorer's number as `matrix.shard || 1`.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.criteria.outputs.shards) }}
    runs-on: ubuntu-latest   # CONSUMER
    # 30, the template's: PR 113's walks ran out of time for causes now fixed, not for want of
    # minutes: a CPU-drawn scene froze the page for seconds a frame (84fed81 draws it at a quarter
    # of the pixels), an explorer could not load /favicon.ico (e8f5824) and one could not sample
    # a page from navigation (d82820d), both now in the site notes. Walks at 84fed81 took 11 to
    # 24 minutes, apart from those two.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    # The URL under test and any further origin the site is served from, as the site step declared
    # them, and the digest of each design reference it
    # supplied, for the verify job's gates. Step outputs: the explorer runs later and cannot change them,
    # and nothing reads them from the pull request. And the run attempt this job ran in, which names
    # the evidence artifact. A job output of several explorers is whichever explorer's GitHub keeps:
    # each resolves the same site and is supplied the same references, so that is the value either
    # way, and `attempt` is then an attempt one of them ran in (the one that ran again, on a re-run of
    # one explorer, 2026-10-08), which the verify job uses only to refuse an attempt with no evidence.
    outputs:
      site-url: ${{ steps.site.outputs.url }}
      site-origins: ${{ steps.site.outputs.origins }}
      references: ${{ steps.references.outputs.references }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # With the base: the feature selection below reads the QAE manifest and the feature map as the
          # base has them, so a pull request cannot narrow its own re-walk.
          fetch-depth: 0
          persist-credentials: false
      - name: Write the explorer's input
        # The PR body the prompt points the explorer at (the criteria job already found a criterion in
        # it, or in its ticket), the ticket's criteria as the criteria job read them, and the changed
        # paths the feature selection reads.
        # It stops on a qae-inputs/ the checkout already has, as the criteria job does: a file there
        # would read as one this workflow wrote (site.md, features/), and a link would move the writes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TICKET: ${{ needs.criteria.outputs.ticket }}
        run: |
          set -euo pipefail
          if [ -e qae-inputs ] || [ -L qae-inputs ]; then echo "::error::the pull request commits qae-inputs/, where this job puts its inputs: remove it from the branch"; exit 1; fi
          mkdir -p qae-artifacts/qae qae-inputs
          gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body > qae-inputs/pr-body.md
          printf '%s' "$TICKET" > qae-inputs/ticket.md
          gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > qae-inputs/changed-files
      - name: Select the features to re-walk
        # Off unless the acceptance-verdict line in .vibe-verifier-qae has --features (docs/feature-map.md).
        # Then each feature whose source globs match a changed path is copied to qae-inputs/features/<id>.md,
        # as this checkout has it, for the explorer to re-walk in part after the criteria: a path more than
        # --shared-over features list counts for none, and at most --max-features are picked.
        # qae-inputs/features.md tells the explorer how many states of each to walk (--max-states, default 3)
        # and which changed paths selected it. The verify job's gate makes the same selection itself and
        # requires one regression-check line and one walked step per feature, so this step only informs.
        # Of several explorers only the first re-walks. Every one runs this step all the same: each
        # counts the selection, so that they share the criteria out alike, and the references step
        # below then takes qae-inputs/features away from every explorer but the first.
        uses: Greenbauer/vibe-verifier/actions/features@a996377d26f76ed69bcce23701038a62373b0661 # main 2026-10-29
        with:
          changed-files: qae-inputs/changed-files
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # For the browser toolchain only. Nothing of this pull request is installed or run on the runner.
        with:
          node-version: '22'
      - name: Build and start the site under test   # CONSUMER: your build and start; leave the URL answering
        # Ends by declaring the URL under test as this step's `url` output: the explorer's prompt names
        # it and the verify job's gate judges requests to it.
        # The install, the build and the server run in a container, never on the runner: they execute
        # this pull request's whole dependency tree, and this job goes on to hold the account-level
        # model token. The container gets the tracked files read-only, no secret and no token, runs as
        # an unprivileged user with no capabilities, and shares only port 3000 with the runner, so a
        # dependency cannot read what the explorer step is given. That is the condition for walking a
        # Dependabot pull request, whose runs read the token from the Dependabot secret store
        # (README.md, "CI").
        # A mail sink in the same container answers the contact route's SMTP send on port 587: it
        # accepts every message and keeps none, so the form's send is checked without real mail. The
        # five mail settings below point the route at it and are not credentials.
        id: site
        env:
          IMAGE: node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
        run: |
          set -euo pipefail
          mkdir -p qae-artifacts/qae qae-inputs/references
          # What the site does on this runner, which the explorer reads first: without it the explorer
          # spent most of its turns probing the page for the head's turn and ran out of turns before its
          # last criterion (PR 113, 2026-10-28). A screenshot must be taken with the scene stopped: told
          # it was not needed (true on a Mac, not on this runner), an explorer retried timed-out
          # screenshots until it ran out of turns. Unable to load /favicon.ico any way it tried, an
          # explorer stalled until the job's time ran out (PR 113, 2026-10-29); so did one that could not
          # start sampling a page before it loaded.
          cat > qae-inputs/site.md <<'MD'
          # The site under test
          - No sign-in: every page is public, and there is one theme.
          - Every page draws a 3D scene behind it (WebGL). This runner has no GPU, so the scene renders in
            software at a few frames a second. The page still works, only slowly.
          - A screenshot waits for the scene to finish a frame, which here can take long enough for it to
            time out. So before every screenshot, stop the scene where it is: run
            `() => { window.requestAnimationFrame = () => 0; }` with the evaluate tool, then take the
            screenshot. The scene stays stopped until the page loads again, so navigate to (or reload)
            the page before the next step that needs it moving. After loading a page, wait until
            `<html>` has the `data-scene-ready` attribute (at most 6 seconds), then 6 seconds more
            before stopping the scene: the header, footer and cards come in then, and the head
            takes its place beside them. Do not retry a screenshot that timed out
            without stopping the scene first. Reading the canvas's pixels or React or three.js internals
            is not needed to check anything a user sees.
          - On this runner the site sees that WebGL is drawn on the CPU and draws the scene at a quarter
            of its pixels, so the page keeps up (about 10 frames a second). For a criterion that samples
            motion every so many milliseconds, keep the scene running while sampling (stopping it stops
            what the scene drives, such as the glass over photos), and stop it only for screenshots.
          - The head turns toward the pointer, read from `mousemove` events on the document, and settles
            within a few seconds here. To check it, load the page, move the mouse (or dispatch a
            `mousemove` with clientX and clientY on the document), wait 4 seconds, stop the scene, and
            take a screenshot; then load the page again and do the same with the pointer on the other
            side. After the pointer has been still for a while, the head looks around on its own. The
            sky turns slowly with the head.
          - Focusing a form field blurs the scene behind the form within a few seconds here: focus it,
            wait 4 seconds, stop the scene, and take a screenshot.
          - This browser fails every request for exactly `/favicon.ico` (as an image or a fetch), as
            Playwright's Chromium does once a page has a route, which this harness sets; any other
            address loads. To look at the favicon, open `/favicon.ico?v=1`, which the site answers with
            the same file.
          - A criterion sampled "from navigation" needs sampling to run while the page loads, which an
            evaluate started after navigating cannot do. Instead, open `/robots.txt` (a plain page with
            no scene), then in one evaluate add an iframe of the criterion's width and height, set its
            `src` to the page under test, and sample it every so many milliseconds from setting `src`,
            reading `iframe.contentDocument` afresh at each sample and skipping samples until it has
            `#page` and its `readyState` is no longer `loading` (before that its styles have not
            applied and nothing is drawn). Inside the iframe the page's window is the iframe's size.
          MD
          # Design references for criteria that name [ref: <key>], read from the base branch so a pull
          # request cannot supply the image it is judged against. Each is a 1x screenshot of the design.
          base="origin/$GITHUB_BASE_REF"
          for path in $(git ls-tree --name-only "$base" .github/qae-references/ | grep '\.png$' || true); do
            git show "$base:$path" > "qae-inputs/references/${path##*/}"
          done
          src="$RUNNER_TEMP/qae-site"
          mkdir -p "$src/tree"
          git archive HEAD | tar -x -C "$src/tree"
          cat > "$src/mail-sink.js" <<'JS'
          const net = require('node:net');

          net
            .createServer((socket) => {
              const say = (text) => socket.write(`${text}\r\n`);
              let pending = '';
              let inMessage = false;
              socket.on('error', () => {});
              socket.on('data', (chunk) => {
                pending += chunk;
                const lines = pending.split('\n');
                pending = lines.pop();
                for (const raw of lines) {
                  const line = raw.replace(/\r$/, '');
                  const verb = line.split(' ', 1)[0].toUpperCase();
                  if (inMessage) {
                    if (line === '.') {
                      inMessage = false;
                      say('250 queued');
                    }
                  } else if (verb === 'EHLO') {
                    say('250-qae mail sink');
                    say('250 AUTH PLAIN');
                  } else if (verb === 'AUTH') {
                    say('235 accepted');
                  } else if (verb === 'DATA') {
                    inMessage = true;
                    say('354 end with a dot');
                  } else if (verb === 'QUIT') {
                    socket.end('221 bye\r\n');
                  } else {
                    say('250 ok');
                  }
                }
              });
              say('220 qae mail sink');
            })
            .listen(587, '127.0.0.1');
          JS
          # An unprivileged user may bind port 587 inside this container's own network namespace only.
          docker run --detach --name qae-site --user node --cap-drop ALL --security-opt no-new-privileges \
            --sysctl net.ipv4.ip_unprivileged_port_start=0 --publish 3000:3000 \
            --volume "$src/tree:/src:ro" --volume "$src/mail-sink.js:/mail-sink.js:ro" \
            --env NEXT_TELEMETRY_DISABLED=1 --env HUSKY=0 \
            --env EMAIL_HOST=127.0.0.1 --env EMAIL_USER=qae --env EMAIL_PASS=qae \
            --env FROM_EMAIL=qae@example.com --env TO_EMAIL=qae@example.com \
            "$IMAGE" sh -ec 'node /mail-sink.js & cp -R /src /home/node/site && cd /home/node/site && npm ci && npm run build && exec npm start -- --hostname 0.0.0.0'
          (docker logs --follow qae-site > qae-artifacts/server.log 2>&1 &)
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "site up after ${i} tries"; echo "url=http://localhost:3000" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' qae-site)" != true ]; then
              echo "::error::the site's container stopped before the site answered"; tail -50 qae-artifacts/server.log; exit 1
            fi
            sleep 5
          done
          echo "::error::site did not answer on http://localhost:3000 within 10 minutes"; tail -50 qae-artifacts/server.log; exit 1
      - name: Prepare the explorer's references and widths
        # A criterion naming `[ref: <key>]` is compared with qae-inputs/references/<key>.png, which the site
        # step supplies (harnesses/qae/README.md). Each is copied into qae-artifacts/references/ before the
        # explorer runs, so the evidence holds what it was compared with, and listed with its width in
        # qae-inputs/references.md. Its digest goes out as the `references` output, so the verify job's gate
        # judges the image the workflow supplied, never one the explorer wrote. None supplied is none copied.
        # The --widths of the manifest's qae-artifacts line (judged from the base) go to qae-inputs/widths,
        # the viewport widths the explorer checks each criterion at and the gate requires; none, no file.
        # Its `max-turns` output is the explorer's turn cap, sized to the criteria, roles, widths and
        # features it walks (harnesses/qae/README.md); the Claude lane passes it as --max-turns.
        # Its `share` output is the sentence that names this explorer's share of the criteria, for the
        # prompt: empty for one explorer. For one of several the criteria are shared out here, by code,
        # the same way in every explore job, so the model never works its share out. The first
        # explorer's load starts at the feature re-walk's walks, so it takes fewer criteria and reaches
        # the re-walk in its time: a selected feature with no walked step fails the gate.
        id: references
        uses: Greenbauer/vibe-verifier/actions/qae-inputs@a996377d26f76ed69bcce23701038a62373b0661 # main 2026-10-29
        with:
          shard: ${{ matrix.shard || 1 }}
          shards: ${{ strategy.job-total }}
      - name: Install the browser toolchain from the catalog's lockfile
        # playwright-mcp, the Playwright build it pins and that build's chromium, every tarball's
        # integrity fixed by tools/qae-browser/package-lock.json in the catalog. Nothing here is
        # resolved from the registry at run time: this job holds the account-level token.
        id: browser
        uses: Greenbauer/vibe-verifier/actions/qae-browser@a996377d26f76ed69bcce23701038a62373b0661 # main 2026-10-29
      - name: Explore the acceptance criteria in a real browser
        # --max-turns is the turn cap the references step sized to this run's walks: a fixed 80 cut off
        # a correct run of two criteria at two widths (harnesses/qae/README.md, "The turn cap").
        id: explorer
        uses: anthropics/claude-code-action@e58dfa55559035499a4982426bb73605e8b5ad8e # v1.0.105
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action refuses a run a bot started unless the bot is named here. Dependabot is the one
          # bot whose pull requests are walked; never '*', which lets any App that can open one start
          # the explorer. A Dependabot run reads the Dependabot secret store, not the Actions one, so
          # the token above is empty there until the repository adds it to that store, which it does
          # only once the site runs in a container (harnesses/qae/README.md, "Dependency updates").
          # And the pull sync's bot, whose update of a branch makes it the actor of this run: a repository
          # that runs actions/pull-sync names it in the PULL_SYNC_BOT variable (`<app>[bot]`).
          allowed_bots: ${{ vars.PULL_SYNC_BOT && format('dependabot[bot],{0}', vars.PULL_SYNC_BOT) || 'dependabot[bot]' }}
          prompt: |
            You are the QAE for pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}.
            The site built from this PR is running at ${{ steps.site.outputs.url }}.
            If qae-inputs/site.md exists, read it before anything else. This repository's workflow wrote it
            (not the pull request): it says how to sign in and what state the site starts in.

            1. Read qae-inputs/pr-body.md. The list items under the "## Acceptance criteria" heading are
               the criteria, numbered AC1, AC2, ... in order. If qae-inputs/ticket.md is not empty, it holds
               the acceptance criteria of the ticket this pull request implements, read the same way (under
               its "## Acceptance criteria" heading, or every list item when it has no headings) and
               numbered TC1, TC2, ...: they are criteria too, whatever the pull request's own list says.
               Below, ACn stands for TCn as well (step log qae/TCn.md, screenshots qae/TCn-step-k.png,
               verdict line acceptance-check: TCn). If the pull request's only item reads "None: <reason>"
               and the ticket lists no criteria, there is nothing for a browser to check: write nothing,
               post nothing, and stop.
               ${{ steps.references.outputs.share }}
            2. For each criterion, use the playwright browser tools to do what a user would do to check
               it: navigate, click, read the page. A step is one action that changes what is on screen.
               For every step, first save a screenshot to qae-artifacts/qae/ACn-step-k.png, then append
               one line to qae-artifacts/qae/ACn.md of the form
                 - step k: <what you did> -> <what you saw>
               Never write a step line without its screenshot: a gate fails the run on any step line
               whose qae/ACn-step-k.png is missing. Reading the console or the network is not a step;
               note what you found on the step it belongs to. On every page you visit, read the browser
               console messages. When you finish a criterion, call browser_network_requests and
               browser_console_messages once more, so the record of what the site did is saved with the run.
               A criterion may carry annotations in square brackets, and a gate checks its step log for them:
               - [ref: <key>] names a design reference, qae-inputs/references/<key>.png, which this repository's
                 workflow supplied; qae-inputs/references.md lists each with its width. Open the image and reach the
                 same screen and state with the browser resized to that width. The comparison is a step of its own:
                 first save its screenshot to qae-artifacts/qae/ACn-step-k.png with the browser still at the
                 reference's width, then compare the two by looking and log that step, naming the reference:
                   - step k: compared with reference <key> -> <what matches and what differs>
                 A gate fails the run when that step has no screenshot, or one not as wide as the reference, so
                 name the reference in that step only.
                 A control present in one image and not the other is a difference, never a match. FAIL the criterion
                 on a structural difference (a missing or extra control, a different layout, a different state),
                 never on pixel noise (anti-aliasing, font rendering, real data in place of sample data). If the
                 image is not there, FAIL the criterion and say the reference was not supplied; never compare
                 against anything else.
               - [as: <role>, <role>] names the roles to walk the criterion as; qae-inputs/site.md says how to sign
                 in as each. Walk it once per role, and start each of that role's step lines with "as <role>:"
                   - step k: as <role>: <what you did> -> <what you saw>
                 As each role, check that what the role may do works, that what it may not do is refused, and that
                 controls it must not use are not shown.
               If qae-inputs/widths exists, it lists viewport widths in pixels, one per line, and a gate checks that
               each criterion's step screenshots include one at each width: check every criterion's end state at
               each of them, with the browser resized to that width, as a step with its own screenshot. If
               qae-inputs/site.md says the site has more than one theme (light and dark), check each end state in
               every theme as well.
               Beyond what a criterion says, on the screen it is about: use every action control the criterion
               touches through to its end state (a save that is saved, not a button that is only shown); after
               saving anything, reload the page and check that the values you entered are still there; and, only
               when that screen has a form or another input, try one invalid input in it (an empty required field,
               a malformed value) and check that the site answers with a handled error, not a crash or a blank page.
               Never navigate to a URL that neither the criterion names nor the site links to: an invented page is
               not an input, and its 404 fails the run. Prefer an input the page refuses before sending anything: a
               request the site answers with 400 or worse fails the run unless the criterion's own text declares it
               (expected-refusal: <status> <path>), and writing that in a step line declares nothing. Log each as a
               step of that criterion; any of them that fails makes the criterion a FAIL.
               If the directory qae-inputs/features/ exists, each <id>.md in it describes a feature this pull
               request's changes touch, as this pull request has that file. After the criteria, re-walk each
               one in part. A feature's states are the numbered steps of its Verify section (in a file with
               none, what each cited test title describes). Walk at most as many states of each feature as
               qae-inputs/features.md says (three when that file is absent). It also lists the changed files
               that selected each feature: walk first the states closest to those files, and walk one state
               of every feature before a second state of any, so that no feature is left unwalked. To walk a
               state, get there as the Reach section says, set up whatever the state needs (who is signed in,
               which record exists), and check what the file says a user would see, and nothing more: the
               checks beyond a criterion, above, are for criteria only. Log its steps as you do a criterion's:
               the feature's step log is qae-artifacts/qae/features/<id>.md and each step's screenshot
               qae-artifacts/qae/features/<id>-step-k.png, under the same rules. A state you did not get to,
               or could not set up in this environment (no such record, no sign-in for that role), is not a
               failure: log no step for it and name it on the feature's regression-skip line.
            3. Write qae-artifacts/verdict.md with exactly one line per criterion, then the lines of each
               feature, nothing else:
                 acceptance-check: ACn -- PASS -- <one sentence> (qae/ACn.md::<the step line text that showed it, exactly as written after "- ">)
               or, when the criterion did not hold or you could not check it:
                 acceptance-check: ACn -- FAIL -- <what happened> (qae/ACn.md::<the step line text>)
               and for each feature of which you walked a state, one line. FAIL only when a step you walked
               showed that the feature no longer works the way its file describes, never because states were
               left unwalked or time ran out; otherwise PASS:
                 regression-check: <id> -- PASS -- <one sentence> (qae/features/<id>.md::<the step line text>)
                 regression-check: <id> -- FAIL -- <what broke> (qae/features/<id>.md::<the step line text>)
               then, for each feature with a state you did not walk, one line naming those states by their
               numbers in its Verify section (or by test title):
                 regression-skip: <id> -- <the states not walked, for example 4, 5, 7>
               A feature of which you walked no state gets its regression-skip line and no regression-check
               line. Never write PASS for anything you did not see in the browser. The text after :: must be
               copied verbatim from the step log line, because a gate checks that it is there.
            4. Post the verdict as a pull request comment, with exactly this command (no other form is allowed):
                 gh pr comment ${{ github.event.pull_request.number }} --body-file qae-artifacts/verdict.md

            Write only under qae-artifacts/. Do not change any other file.
          claude_args: >-
            --model claude-opus-4-7
            --max-turns ${{ steps.references.outputs.max-turns }}
            --mcp-config '{"mcpServers":{"playwright":{"command":"node","args":["${{ steps.browser.outputs.mcp }}","--browser","chromium","--headless","--isolated","--output-dir","qae-artifacts","--save-session","--viewport-size","1280x800","--init-page","${{ steps.browser.outputs.console-pages }}"]}}}'
            --allowed-tools "mcp__playwright,Read(qae-inputs/**),Read(qae-artifacts/**),Edit(qae-artifacts/**),Bash(mkdir:*),Bash(gh pr comment ${{ github.event.pull_request.number }} --body-file qae-artifacts/verdict.md)"
            # Read and Edit rules are the only file rules Claude Code consults (a Write(path) rule is
            # accepted and ignored), and an allow rule anchors at the working directory, so the model
            # can read its inputs and artifacts and write artifacts, and nothing else: not the runner's
            # environment, not the checkout. The PR body it reads is untrusted; without this a body
            # could ask it to read /proc/self/environ and post the tokens with the allowed gh pr comment.
            # The comment rule is the exact command, not gh pr comment:*: gh opens --body-file itself, so
            # the Read rules never see that read, and any other path would post whatever file it names.
      - name: Collect numeric usage
        if: always()
        uses: Greenbauer/vibe-verifier/actions/usage@a996377d26f76ed69bcce23701038a62373b0661 # main 2026-10-29
        with:
          source-file: ${{ steps.explorer.outputs.execution_file }}
          source-ran: true
          role: qae-explorer
          job-key: explore
      - name: Keep numeric usage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vv-usage-qae-explorer-${{ github.run_attempt }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: ${{ runner.temp }}/vv-usage/usage.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce the write scope
        # The prompt says "write only under qae-artifacts/", and a prompt is a suggestion. Anything
        # else that changed on the runner, tracked or untracked, fails the job here so it can never
        # reach the artifact or the gate. Build output and node_modules are gitignored, so they
        # do not appear; qae-inputs/ is written by the workflow itself before the model runs, and
        # .claude-pr/ is claude-code-action's own scaffolding (seen on the pilot's second run).
        # The action also resets CLAUDE.md, .claude/, .mcp.json and a few more config paths to the
        # base branch before the model runs (src/github/operations/restore-config.ts at the pinned
        # action), so a PR that touches one of them leaves it changed here without the explorer
        # having written it (seen on a consumer's first pull request). Those paths are excused only while they
        # match the base exactly; anything the explorer writes to them differs and still fails.
        if: always()
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          restored='^(\.claude|\.claude\.json|\.mcp\.json|\.gitmodules|\.ripgreprc|CLAUDE\.md|CLAUDE\.local\.md|\.husky)(/|$)'
          out=""
          while IFS= read -r line; do
            path=${line:3}
            case "$path" in qae-artifacts/*|qae-inputs/*|.claude-pr/*) continue ;; esac
            if [[ "$path" =~ $restored ]] && git diff --quiet "$BASE" -- "$path" 2>/dev/null; then continue; fi
            out+="$line"$'\n'
          done < <(git status --porcelain --untracked-files=all)
          if [ -n "$out" ]; then
            echo "::error::the explorer wrote outside qae-artifacts/:"; printf '%s' "$out"; exit 1
          fi
          echo "write scope held"
      - name: Keep the verdict with the evidence
        # The verify job reads the verdict from this run's evidence, never from a pull request comment:
        # the file the explorer wrote is copied to verdicts/<explorer>.md, by the workflow, after the
        # explorer. Then, for one of several explorers, everything it left gets its number in its name,
        # so the verify job can merge every explorer's evidence into one directory: session-*/,
        # console-*.log and network-*.log, which the gates read by those names, become session-<n>-*/
        # and so on, and every other file that is not a criterion's own goes under shard-<n>/. The
        # session log names files by their paths, so those paths are renamed in it as well. The page
        # record (console-pages.jsonl) keeps its name: the verify job appends each explorer's to one
        # file. The one explorer of an unsplit run keeps every name it wrote.
        if: always()
        env:
          SHARD: ${{ matrix.shard || 1 }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          python3 - <<'PY'
          import glob, os, re, shutil
          root, shard, moved = "qae-artifacts", os.environ["SHARD"], {}
          own = "shard-" + shard

          def rename(old, new):
              os.makedirs(os.path.dirname(os.path.join(root, new)), exist_ok=True)
              os.rename(os.path.join(root, old), os.path.join(root, new))
              moved[old] = new

          def entries(*folder):
              path = os.path.join(root, *folder)
              return sorted(os.listdir(path)) if os.path.isdir(path) else []

          # verdicts/ holds what this step copies and nothing the explorer put there.
          shutil.rmtree(os.path.join(root, "verdicts"), ignore_errors=True)
          verdict = os.path.join(root, "verdict.md")
          if os.path.isfile(verdict) and os.path.getsize(verdict):
              os.makedirs(os.path.join(root, "verdicts"))
              shutil.copyfile(verdict, os.path.join(root, "verdicts", shard + ".md"))
          if os.environ["SHARDS"] != "1":
              for name in entries():
                  globbed = re.match(r"(session|console|network)-", name)
                  if name in ("qae", "references", "verdicts", "console-pages.jsonl", own):
                      continue
                  if globbed and (globbed.group(1) == "session" or name.endswith(".log")):
                      rename(name, "%s-%s-%s" % (globbed.group(1), shard, name[globbed.end():]))
                  else:
                      rename(name, own + "/" + name)
              for name in entries("qae"):
                  if name != "features" and not re.match(r"(AC|TC)[0-9]", name):
                      rename("qae/" + name, own + "/qae/" + name)
          for log in glob.glob(os.path.join(root, "session-*", "session.md")):
              with open(log, encoding="utf-8", errors="surrogateescape") as handle:
                  text = was = handle.read()
              if moved:  # one pass, longest name first, so no renamed path is renamed twice
                  names = "|".join(re.escape(old) for old in sorted(moved, key=len, reverse=True))
                  text = re.sub(re.escape(root + "/") + "(" + names + r")(?![\w.-])", lambda found: root + "/" + moved[found.group(1)], text)
              if text != was:
                  with open(log, "w", encoding="utf-8", errors="surrogateescape") as handle:
                      handle.write(text)
          print("explorer %s: %s, %d renamed" % (shard, "a verdict" if entries("verdicts") else "no verdict", len(moved)))
          PY
      - name: Keep the evidence
        # Named for the run attempt: this step runs always, so a failed or cancelled attempt uploads
        # too, and under one name for every attempt a re-run's verify job was handed an earlier
        # attempt's evidence (a consumer's third attempt, 2026-10-07: the explorer passed and both
        # gates read the cancelled second attempt's artifact). And for the explorer, past the first.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qae-artifacts-${{ github.run_attempt }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: qae-artifacts
          if-no-files-found: warn

  verify:
    name: Acceptance criteria
    needs: [criteria, explore]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # the QA review comment, and nothing else
      actions: read    # the explore jobs of this run, and
      checks: read     # their failure annotations: a model usage limit gets its own QA review (actions/qa-review)
    steps:
      - name: Require a finished criteria job
        # The explore job is skipped when the criteria job found nothing to walk, and also when that
        # job failed, since a job whose need failed is skipped too. Only the first is a pass.
        env:
          CRITERIA_RESULT: ${{ needs.criteria.result }}
        run: |
          if [ "$CRITERIA_RESULT" != success ]; then echo "::error::the criteria job ended $CRITERIA_RESULT, so nothing was decided"; exit 1; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the declared inputs
        # These files are the gates' inputs, rewritten here whatever the branch has. A qae-inputs/ the checkout
        # already has came from the pull request (Git makes no empty directory), so the step stops before
        # writing: a link there could send them anywhere on the runner.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SITE_URL: ${{ needs.explore.outputs.site-url }}
          SITE_ORIGINS: ${{ needs.explore.outputs.site-origins }}
          REFERENCES: ${{ needs.explore.outputs.references }}
          TICKET: ${{ needs.criteria.outputs.ticket }}
          CARRY: ${{ needs.criteria.outputs.carry }}
        run: |
          set -euo pipefail
          if [ -e qae-inputs ] || [ -L qae-inputs ]; then echo "::error::the pull request commits qae-inputs/, where this job puts its inputs: remove it from the branch"; exit 1; fi
          mkdir -p qae-inputs
          gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body > qae-inputs/pr-body.md
          gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > qae-inputs/changed-files
          # The verdict comes from this run's evidence, in the step after the download below. Empty until
          # then, and for a pull request with nothing to walk: the gate is given a file either way.
          : > qae-inputs/verdict.md
          # The URL the explore job's site step declared, for the gate's --site-file. Empty when that
          # step never declared one, and the gate refuses an empty file. Further origins the step
          # declared follow the site, which stays first: the gate reads the first URL as the site.
          printf '%s\n' "$SITE_URL" > qae-inputs/site-url
          if [ -n "$SITE_URL" ] && [ -n "$SITE_ORIGINS" ]; then printf '%s\n' "$SITE_ORIGINS" >> qae-inputs/site-url; fi
          # The digest of each design reference the explore job's workflow supplied, for the gate's
          # --references. Empty when that job never got that far, which the gate reads as none supplied.
          printf '%s\n' "$REFERENCES" > qae-inputs/references.json
          # The ticket's criteria as the criteria job read them (empty: no ticket), for the gates' --ticket.
          printf '%s' "$TICKET" > qae-inputs/ticket.md
          # The facts the criteria job decided a carry on (empty: none read), so this job decides alike.
          printf '%s' "$CARRY" > qae-inputs/carry.json
      - name: Read the criteria
        id: criteria
        uses: Greenbauer/vibe-verifier/actions/criteria@a996377d26f76ed69bcce23701038a62373b0661 # main 2026-10-29
        with:
          path: qae-inputs/pr-body.md
          changed-files: qae-inputs/changed-files
          ticket: qae-inputs/ticket.md
          carry: qae-inputs/carry.json   # the criteria job's facts, so both jobs decide a carry alike
      - name: Tell a model usage limit from a failure
        # A failed explore job whose every explorer hit its model usage limit walked nothing. This step reads
        # their failure annotations and, when that is so, warns with each limit and its reset: the steps below
        # that judge a walk are skipped, so this job passes with the warning, and the QA review records the head
        # as limited, never as walked (operator, 2026-10-29). An explorer that succeeded or failed any other way,
        # or annotations it cannot read, leave `limited` false and the job judges as before.
        id: limit
        if: needs.explore.result == 'failure'
        uses: Greenbauer/vibe-verifier/actions/qa-limit@a996377d26f76ed69bcce23701038a62373b0661 # main 2026-10-29
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.criteria.outputs.count != '0' && steps.limit.outputs.limited != 'true'
        # Every explorer's evidence, of every attempt of this run, each in a directory named for its
        # artifact: qae-evidence/qae-artifacts-<attempt>[-<explorer>]/ in the runner's temporary directory,
        # outside the checkout, so a directory the pull request commits is never one of them. The next
        # step picks among them.
        with:
          pattern: qae-artifacts-*
          path: ${{ runner.temp }}/qae-evidence
      - name: Merge the evidence and read the verdict
        # qae-artifacts/ becomes the evidence of each explorer the criteria job planned, from the newest
        # attempt that explorer left any in: this attempt's on a full re-run, an earlier one's for an
        # explorer that was not run again. Two explorers that left the same path with different content
        # fail the step (nothing is overwritten), and so does an explore job that reported an attempt
        # newer than any evidence, or none: that attempt left nothing to judge. An explorer that left
        # no evidence is named and its criteria then have no verdict, which the gate refuses. The page
        # record, console-pages.jsonl, is one line per console error or uncaught exception, and the gate
        # reads it under that one name: every explorer's lines are appended to it.
        # qae-inputs/verdict.md is the explorers' verdicts/<explorer>.md, in order: the files the
        # workflow copied in this run. No pull request comment is read, so nobody can paste a verdict,
        # and a run never takes another run's verdict (a carried walk runs no explorer and no gate).
        # A qae-artifacts/ the checkout already has came from the pull request (Git makes no empty
        # directory), so the step stops before writing anything: a link there could send the copies
        # anywhere on the runner. The gates refuse such evidence too (gates/_contract.py, planted).
        if: steps.criteria.outputs.count != '0' && steps.limit.outputs.limited != 'true'
        env:
          SHARDS: ${{ needs.criteria.outputs.shards }}
          EXPLORE_ATTEMPT: ${{ needs.explore.outputs.attempt }}
          EVIDENCE: ${{ runner.temp }}/qae-evidence
        run: |
          python3 - <<'PY'
          import filecmp, json, os, re, shutil, sys

          def stop(message):
              print("::error::" + message)
              sys.exit(1)

          if os.path.lexists("qae-artifacts"):
              stop("the pull request commits qae-artifacts/, where this run's evidence goes: remove it from the branch")
          wanted = [number or 1 for number in json.loads(os.environ["SHARDS"])]
          newest, evidence = {}, os.environ["EVIDENCE"]
          for name in sorted(os.listdir(evidence)) if os.path.isdir(evidence) else []:
              named = re.fullmatch(r"qae-artifacts-([1-9][0-9]*)(?:-([1-9][0-9]*))?", name)
              if named and int(named.group(2) or 1) in wanted:
                  shard, found = int(named.group(2) or 1), (int(named.group(1)), os.path.join(evidence, name))
                  newest[shard] = max(newest.get(shard, found), found)
          reported = os.environ["EXPLORE_ATTEMPT"]
          if not reported.isdigit() or max([attempt for attempt, _ in newest.values()], default=0) < int(reported):
              stop("the explore job reported attempt %r and left no evidence in it" % reported)
          owner, clashes = {}, []
          for shard in wanted:
              if shard not in newest:
                  print("::warning::explorer %d left no evidence, so its criteria have no verdict" % shard)
                  continue
              print("explorer %d: %s" % (shard, os.path.basename(newest[shard][1])))
              for folder, _, files in os.walk(newest[shard][1]):
                  for name in files:
                      source = os.path.join(folder, name)
                      path = os.path.relpath(source, newest[shard][1])
                      target = os.path.join("qae-artifacts", path)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      if path == "console-pages.jsonl":
                          with open(source, "rb") as part, open(target, "ab") as whole:
                              whole.write(part.read().rstrip(b"\n") + b"\n")
                      elif path not in owner:
                          owner[path] = shard
                          shutil.copyfile(source, target)
                      elif not filecmp.cmp(source, target, shallow=False):
                          clashes.append("explorers %d and %d both left %s" % (owner[path], shard, path))
          if clashes:
              stop("the evidence cannot be merged: " + "; ".join(clashes[:20]))
          with open("qae-inputs/verdict.md", "w", encoding="utf-8") as verdict:
              for shard in wanted:
                  path = os.path.join("qae-artifacts", "verdicts", "%d.md" % shard)
                  if os.path.isfile(path):
                      with open(path, encoding="utf-8", errors="replace") as handle:
                          verdict.write(handle.read().rstrip("\n") + "\n")
          PY
          echo "verdict lines: $(grep -c 'acceptance-check:' qae-inputs/verdict.md || true)"
      - name: Run the QA gates
        id: gates
        if: steps.criteria.outputs.declared-none == '' && steps.limit.outputs.limited != 'true'
        uses: Greenbauer/vibe-verifier/actions/gates@a996377d26f76ed69bcce23701038a62373b0661 # main 2026-10-29
        with:
          manifest: .vibe-verifier-qae
      - name: Require every explorer of a split run
        # The first explorer's job has the explore job's plain name whatever the split, so a branch rule
        # can require it. The others, that name with (2), (3), ..., exist only on a large pull request,
        # and no rule can name them. So on a split run this job fails unless every explorer's job
        # succeeded, after the gates have said what they found. A run with one explorer is not touched.
        if: ${{ !cancelled() && needs.criteria.outputs.shards != '[""]' && needs.explore.result != 'success' && needs.explore.result != 'skipped' && steps.limit.outputs.limited != 'true' }}
        env:
          EXPLORE_RESULT: ${{ needs.explore.result }}
        run: |
          echo "::error::an explorer's job did not succeed (the explore job ended $EXPLORE_RESULT): run the failed explorer again"; exit 1
      - name: Post the QA review
        # One comment per pull request, edited in place on every run: passed, changes needed, not
        # required, or could not run, from what the jobs and gates concluded, never the explorer's prose.
        if: ${{ !cancelled() }}
        uses: Greenbauer/vibe-verifier/actions/qa-review@a996377d26f76ed69bcce23701038a62373b0661 # main 2026-10-29
        with:
          criteria: qae-inputs/pr-body.md
          verdict: qae-inputs/verdict.md
          ticket: qae-inputs/ticket.md
          explore-result: ${{ needs.explore.result }}
          gates-outcome: ${{ steps.gates.outcome }}
          not-required: ${{ steps.criteria.outputs.declared-none }}
          carried-from: ${{ steps.criteria.outputs.carried-from }}
          limits: ${{ steps.limit.outputs.limits }}
          token: ${{ secrets.GITHUB_TOKEN }}
