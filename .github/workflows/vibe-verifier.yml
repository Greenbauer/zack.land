name: Standards

# Runs the gates this repository subscribes to in .vibe-verifier.
# The catalog's gates ship with the pinned action. The eslint gate runs this repository's own ESLint
# (.vibe-verifier-tools/eslint.json), whose config loads its plugins from node_modules, so the job
# installs the packages and puts node_modules/.bin on PATH first.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: vibe-verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Keep this job free of `if:` conditions. GitHub reports an if-false job as
  # skipped, and counts a skipped required check as satisfied.
  vibe-verifier-ok:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Install the packages ESLint's config loads
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          CYPRESS_INSTALL_BINARY: '0'
          HUSKY: '0'
      - uses: Greenbauer/vibe-verifier/actions/gates@bb51d1a242c80a59c821d80888500c7a3b230d1f # main 2026-11-10
